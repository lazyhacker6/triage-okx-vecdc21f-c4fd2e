name: Patch Testing Cycles

on:
  pull_request:

jobs:
  patch-testing-cycles:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v6"

      - name: "Upload cycle stats"
        uses: actions/upload-artifact@v4
        with:
          name: patch-testing-results
          path: patch-testing
          retention-days: 1
